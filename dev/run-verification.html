<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Survivor Mini — kiểm thử lượt chơi</title>
    <style>
      body {
        margin: 0;
        background: #112c27;
        color: #fff3cb;
        font: 14px Arial;
        display: flex;
        gap: 25px;
        padding: 20px;
        justify-content: center;
      }
      #game {
        width: 390px;
        height: 844px;
        position: relative;
      }
      aside {
        width: 360px;
      }
      button {
        padding: 15px;
        background: #f2c779;
        color: #17382d;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        line-height: 1.8;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <aside>
      <h1>Kiểm thử vòng chơi thật</h1>
      <p>
        Tăng tốc bằng các bước mô phỏng 16,67ms bổ sung. Không sửa HP, XP, sát
        thương hay thời điểm boss. Bot chọn kỹ năng và né quái bằng điều khiển
        bình thường.
      </p>
      <button id="start">Chạy kiểm thử</button>
      <pre id="log">Đang tải…</pre>
    </aside>
    <script type="module" src="/dev/run-verification.ts"></script>
  </body>
</html>
