<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Survivor Mini — xem chuyển động</title>
    <style>
      body {
        margin: 0;
        background: #112c27;
        color: #fff1ca;
        font:
          16px Trebuchet MS,
          Arial;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
      }
      h1 {
        font: 700 26px Georgia;
        margin: 0;
      }
      p {
        color: #abc3a9;
        font-size: 13px;
      }
      #preview {
        width: min(94vw, 1024px);
        aspect-ratio: 1024/440;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        border-radius: 24px;
        border: 1px solid #94ad7444;
      }
    </style>
  </head>
  <body>
    <h1>Đối chiếu tỷ lệ và chuyển động</h1>
    <p>Cùng nhân vật và bộ điều khiển animation đang dùng trong game.</p>
    <div id="preview"></div>
    <p>
      Ảnh gốc · Đứng nghỉ · Đi chậm · Chạy — cùng đường chạm đất. Nhấn Space để
      dừng/tiếp tục.
    </p>
    <script type="module">
      import Phaser from "phaser";
      import { PlayerActor } from "/src/game/PlayerActor.ts";
      import { PlayerMotion } from "/src/game/PlayerMotion.ts";
      class Preview extends Phaser.Scene {
        preload() {
          PlayerActor.preload(this);
          this.load.image("reference-an", "/assets/adventurer.webp");
        }
        create() {
          const hero =
            new URLSearchParams(location.search).get("hero") === "linh"
              ? "linh"
              : "an";
          this.paused = false;
          this.input.keyboard.on("keydown-SPACE", () => {
            this.paused = !this.paused;
          });
          const reference = this.add
            .image(128, 352, hero === "linh" ? "linh-idle" : "reference-an")
            .setOrigin(0.55, 1);
          reference.setScale((76 * 1.08 * 2.7) / reference.height);
          this.add
            .text(128, 396, "ẢNH GỐC", {
              fontFamily: "Arial",
              fontSize: "14px",
              color: "#e5d5a7",
            })
            .setOrigin(0.5);
          this.actors = [];
          this.motions = [];
          for (let i = 0; i < 3; i++) {
            const x = 384 + i * 256;
            this.add.ellipse(x, 352, 112, 22, 0x0b211d, 0.55);
            const actor = new PlayerActor(this, x, 270);
            actor.useHero(hero);
            this.actors.push(actor);
            this.motions.push(new PlayerMotion());
            this.add
              .text(x, 396, ["ĐỨNG NGHỈ", "ĐI CHẬM", "CHẠY"][i], {
                fontFamily: "Arial",
                fontSize: "14px",
                color: "#e5d5a7",
              })
              .setOrigin(0.5);
          }
        }
        update(time, delta) {
          if (!this.actors || this.paused) return;
          const dt = Math.min(delta, 45) / 1000;
          this.actors.forEach((actor, i) => {
            const direction =
              new URLSearchParams(location.search).has("turn") &&
              Math.floor(time / 4000) % 2
                ? -1
                : 1;
            const m = this.motions[i].step([0, 0.35, 1][i] * direction, 0, dt);
            actor.animate(m.dx, m.dy, dt);
            actor.setScale(actor.scaleX * 2.7, actor.scaleY * 2.7);
          });
        }
      }
      new Phaser.Game({
        type: Phaser.AUTO,
        parent: "preview",
        width: 1024,
        height: 440,
        backgroundColor: "#244a37",
        scene: Preview,
        audio: { noAudio: true },
        banner: false,
      });
    </script>
  </body>
</html>
