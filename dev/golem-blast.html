<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survivor Mini — Golem bộc phá</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #112c27;
        color: #fff3cb;
        font: 15px Arial;
        display: flex;
        justify-content: center;
        gap: 28px;
      }
      #game {
        width: 390px;
        height: 844px;
        flex-shrink: 0;
      }
      aside {
        max-width: 350px;
      }
      h1 {
        font: 700 28px Georgia;
      }
      button {
        padding: 12px 15px;
        border: 1px solid #d5b96b;
        border-radius: 10px;
        background: #f2c779;
        color: #17382d;
        cursor: pointer;
        margin: 4px;
      }
      p,
      pre {
        line-height: 1.6;
      }
      pre {
        white-space: pre-wrap;
      }
      canvas {
        display: block;
        border-radius: 22px;
      }
      @media (max-width: 760px) {
        body {
          flex-direction: column;
          align-items: center;
        }
        #game {
          width: min(390px, 94vw);
          height: 700px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <aside>
      <h1>Golem · Bộc phá</h1>
      <p>
        Cảnh kiểm tra riêng: đưa boss vào ngay, bỏ quái thường và vũ khí để quan
        sát. Dùng đòn, hiệu ứng và sát thương của engine thật; không phải lượt
        chơi cân bằng.
      </p>
      <button id="play">Chạy đòn nổ</button
      ><button id="pause">Dừng / tiếp tục</button
      ><button id="warning">Cảnh báo</button><button id="impact">Lõi nổ</button
      ><button id="smoke">Khói bụi</button
      ><button id="quality">Giảm hiệu ứng: TẮT</button
      ><button id="verify">Kiểm tra vòng đời</button>
      <pre id="log">Đang tải…</pre>
    </aside>
    <script type="module" src="/dev/golem-blast.ts"></script>
  </body>
</html>
