<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survivor Mini — chiến dịch 2.0</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 28px;
        background: #112c27;
        color: #fff3cb;
        font: 14px Arial;
      }
      #stage.game-shell {
        width: 390px;
        height: 844px;
        flex-shrink: 0;
      }
      #qa-ui {
        position: absolute;
        inset: 0;
      }
      aside {
        width: 350px;
      }
      aside h1 {
        font: 700 28px Georgia;
      }
      aside p,
      aside pre {
        line-height: 1.65;
        white-space: pre-wrap;
      }
      aside button {
        padding: 12px;
        margin: 4px;
        border: 1px solid #d5b96b;
        border-radius: 10px;
        background: #f2c779;
        color: #17382d;
        cursor: pointer;
      }
      aside button:disabled {
        opacity: 0.4;
      }
      #verify-log {
        color: #d8efb7;
      }
      @media (max-width: 760px) {
        body {
          flex-direction: column;
          align-items: center;
        }
        #stage.game-shell {
          width: min(390px, 94vw);
          height: 780px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage" class="game-shell">
      <div id="game" class="game-canvas"></div>
      <div id="qa-ui"></div>
    </div>
    <aside>
      <h1>Chiến dịch · Trang thử 2.0</h1>
      <p>
        Cảnh QA có đặt sẵn cấp và mana, HP nhân vật cao. Dùng engine, pet, rage
        và boss thật; không ghi hồ sơ cá nhân. Chọn vùng/pet/chiêu rồi bấm dựng
        cảnh. Bấm nút cuồng nộ trong màn chơi; phím SPACE cũng được.
      </p>
      <label
        >Vùng
        <select id="map">
          <option value="forest">Rừng</option>
          <option value="ashlands">Vực tro</option>
          <option value="glacier">Thành băng</option>
        </select></label
      >
      <label
        >Pet
        <select id="pet">
          <option value="fox">Cáo</option>
          <option value="owl">Cú</option>
          <option value="sprout">Mầm xanh</option>
        </select></label
      >
      <label
        >Chiêu
        <select id="weapon">
          <option value="sword">Kiếm</option>
          <option value="fireball">Lửa</option>
          <option value="lightning">Sét</option>
          <option value="frost">Băng</option>
          <option value="leaf">Lá</option>
        </select></label
      >
      <button id="setup" disabled>Dựng cảnh</button
      ><button id="mana" disabled>Nạp mana QA</button
      ><button id="boss" disabled>Gọi boss</button
      ><button id="upgrade" disabled>Thêm XP QA</button
      ><button id="home" disabled>Về trại</button>
      <pre id="log">Đang tải…</pre>
    </aside>
    <script type="module" src="/dev/campaign-gallery.tsx"></script>
  </body>
</html>
